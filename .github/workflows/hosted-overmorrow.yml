name: Build hosted Overmorrow client
run-name: Pinned Overmorrow build and isolated synthetic Firefox trials

on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: Historical build, input data or installed environment inventory
        type: choice
        default: historical-v1
        options: [historical-v1, source-input-inventory, installed-environment-inventory, runtime-boundary-verification, source-candidate-build, source-pub-diagnostic]
  push:
    branches: [feature/hosted-overmorrow]
    paths:
      - .github/workflows/hosted-overmorrow.yml
      - scripts/prepare_hosted_overmorrow_ci.py
      - scripts/prepare_hosted_flutter.py
      - scripts/prepare_hosted_clients_ci.py
      - scripts/prepare_hosted_source_recipe.py
      - scripts/prepare_hosted_client_inputs.py
      - scripts/prepare_hosted_client_apt.py
      - third_party/client-locks/**
      - third_party/client-notices/**
      - third_party/client-notices-v1.json
      - tests/test_hosted_client_inputs.py
      - tests/test_hosted_source_recipe.py
      - scripts/prepare_hosted_decoder.py
      - scripts/prepare_hosted_decoder_ci.py
      - scripts/hosted-clients-bwrap.apparmor
      - scripts/prepare_hosted_runtime.py
      - third_party/hosted-runtime*.json
      - third_party/apparmor-ci/**
      - tests/test_hosted_*.py
      - integrations/overmorrow/**
      - src/**

permissions:
  contents: read

concurrency:
  group: weather-hosted-overmorrow-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  overmorrow:
    if: github.event.inputs.input_mode == '' || github.event.inputs.input_mode == 'historical-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact source and inert preparation contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test -f tests/test_hosted_flutter.py
          test -f tests/test_hosted_overmorrow_ci.py
          test -f tests/test_hosted_overmorrow_workflow.py
          python3 -B -m unittest discover -s tests -p 'test_hosted_*.py'
      - name: Retrieve the reviewed public Browser helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-browser
          ref: 08bac388a0abfd06426bebe8f6fabd0157d2e709
          path: build/hosted-browser-source
          persist-credentials: false
      - name: Install dependencies only on this disposable runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          timeout 180s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          timeout 300s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            apparmor bubblewrap git python3 util-linux iproute2 ca-certificates curl unzip xz-utils zip libglu1-mesa debianutils \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6t64 libpci3 fonts-dejavu-core \
            libnspr4 libevent-2.1-7t64 libvpx9
          umask 077
          dpkg-query -W apparmor bubblewrap git python3 util-linux iproute2 ca-certificates curl unzip xz-utils zip \
            libglu1-mesa debianutils libc6 libstdc++6 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 \
            libxt6t64 libpci3 fonts-dejavu-core libnspr4 libevent-2.1-7t64 libvpx9 \
            > build/hosted-overmorrow-packages.txt
      - name: Prepare the pinned public Flutter SDK without executing it
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_flutter.py --fetch \
            --output "$GITHUB_WORKSPACE/build/hosted-flutter-sdk"
      - name: Prepare authenticated public browser and fixture runtimes
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_runtime.py --with-npm --fetch \
            --output "$GITHUB_WORKSPACE/build/hosted-client-runtime"
      - name: Build offline and exercise the real client and native tables
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_overmorrow_ci.py
      - name: Retain bounded build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-overmorrow-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/hosted-overmorrow-packages.txt
            build/hosted-client-runtime/provenance.json
            build/hosted-flutter-sdk/provenance.json
            build/hosted-overmorrow-ci/*.json
            build/hosted-overmorrow-ci/*.log
            build/overmorrow-hosted-browser-ci/report.json
            build/overmorrow-hosted-browser-ci/*.log
            build/overmorrow-hosted-table-ci/report.json
            build/overmorrow-hosted-table-ci/*.log
      - name: Prepare the successful source recipe
        if: success()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_source_recipe.py --profile overmorrow \
            --expected-commit "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/build/hosted-overmorrow-source-recipe"
      - name: Retain only the successful source recipe
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-overmorrow-source-recipe-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/hosted-overmorrow-source-recipe
      - name: State the scope of the trial
        if: always()
        run: |
          printf '%s\n' \
            'Inspect original outcomes: actual Overmorrow build, synthetic UI and ordered native tables.' \
            'No live Weather source request, core delivery, private bundle upload or native mobile proof.' \
            'SDK, pub cache, application profiles and Git data are never exported as artifacts.' \
            'Source recipes contain references, not full upstream/dependency source or runtime acceptance.' \
            >> "$GITHUB_STEP_SUMMARY"

  input-candidate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.input_mode == 'source-input-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify candidate source before primary data acquisition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          umask 077
          mkdir -m 700 -p build
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_inputs.py'
      - name: Acquire signed snapshot and locked dependency candidate as data
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=15s 1500s python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode source-input-inventory
      - name: Project closed source and metadata evidence
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode stage-input-metadata
      - name: Retain only candidate metadata and original source notices
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-overmorrow-input-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build/hosted-overmorrow-input-candidate-public
      - name: Remove runner-local package data
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = "$(pwd -P)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf -- "$GITHUB_WORKSPACE/build/hosted-overmorrow-input-candidate" "$GITHUB_WORKSPACE/build/hosted-overmorrow-input-candidate-public"

  installed-environment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.input_mode == 'installed-environment-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fixed source and package-input authority before provisioning
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          umask 077
          mkdir -m 700 -p build
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_inputs.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_environment.py'
      - name: Provision exact signed packages and inventory installed environment
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=60s 1500s python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode installed-environment-inventory
      - name: Project closed source and metadata evidence
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode stage-input-metadata
      - name: Retain only candidate metadata and original source notices
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-overmorrow-installed-environment-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build/hosted-overmorrow-input-candidate-public
      - name: Remove private package data only after installer cleanup
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = "$(pwd -P)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode cleanup-input-data

  runtime-boundary:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.input_mode == 'runtime-boundary-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check fixed source and inert runtime boundary contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          umask 077
          mkdir -m 700 -p build
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_environment.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_runtime.py'
      - name: Retrieve the existing pinned Browser helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-browser
          ref: 08bac388a0abfd06426bebe8f6fabd0157d2e709
          path: build/hosted-browser-source
          persist-credentials: false
      - name: Verify both closed runtime views without application builds
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=60s 2400s python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode runtime-boundary-verification
      - name: Project only closed metadata
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode stage-input-metadata
      - name: Retain runtime boundary metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-weather-runtime-boundary-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build/hosted-overmorrow-input-candidate-public
      - name: Remove private inputs after confirmed process and policy cleanup
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = "$(pwd -P)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 -B scripts/prepare_hosted_client_inputs.py --profile overmorrow --mode cleanup-input-data

  source-candidate:
    name: P15 ${{ github.event.inputs.input_mode }}
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.input_mode == 'source-candidate-build' || github.event.inputs.input_mode == 'source-pub-diagnostic')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact P15 source and inert input contracts
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          umask 077
          mkdir -m 700 -p build/p15-inert-tests
          export TMPDIR="$GITHUB_WORKSPACE/build/p15-inert-tests"
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_hooks.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_plugins.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_sources.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_pub_metadata.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_pub_outputs.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_dependencies.py'
          python3 -B -m unittest discover -s tests -p 'test_hosted_overmorrow_candidate.py'
          python3 -B -m unittest discover -s integrations/overmorrow -p 'test_build.py'
          python3 -B -m unittest discover -s integrations/overmorrow -p 'test_deploy.py'
      - name: Retrieve the original pinned Browser policy helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-browser
          ref: 08bac388a0abfd06426bebe8f6fabd0157d2e709
          path: build/hosted-browser-source
          persist-credentials: false
      - name: Run the bounded candidate or diagnostic-only pub prefix
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=90s 2400s python3 -B scripts/prepare_hosted_overmorrow_candidate.py
      - name: Retain only closed P15 candidate metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p15-overmorrow-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/p15-overmorrow-candidate-public/result.json
            build/p15-overmorrow-candidate-public/cleanup.json
