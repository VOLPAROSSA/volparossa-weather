name: Build hosted Weather clients
run-name: Pinned Drizz.li build and isolated synthetic Firefox trial

on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: Historical build or bounded input candidate (no compilation)
        type: choice
        default: historical-v1
        options: [historical-v1, source-input-inventory]
  push:
    branches: [feature/hosted-weather-clients]
    paths:
      - .github/workflows/hosted-clients.yml
      - scripts/prepare_hosted_clients_ci.py
      - scripts/prepare_hosted_source_recipe.py
      - scripts/prepare_hosted_client_inputs.py
      - scripts/prepare_hosted_client_apt.py
      - third_party/client-locks/**
      - third_party/client-notices/**
      - third_party/client-notices-v1.json
      - tests/test_hosted_client_inputs.py
      - tests/test_hosted_source_recipe.py
      - scripts/prepare_hosted_decoder.py
      - scripts/prepare_hosted_decoder_ci.py
      - scripts/hosted-clients-bwrap.apparmor
      - scripts/prepare_hosted_runtime.py
      - third_party/hosted-runtime*.json
      - third_party/apparmor-ci/**
      - tests/test_hosted_clients*.py
      - tests/test_hosted_runtime.py
      - integrations/drizzli/**
      - src/**

permissions:
  contents: read

concurrency:
  group: weather-hosted-clients-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  drizzli:
    if: github.event.inputs.input_mode != 'source-input-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact source and inert preparation contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test -f tests/test_hosted_clients_ci.py
          python3 -B -m unittest discover -s tests -p 'test_hosted_*.py'
      - name: Retrieve the reviewed public Browser helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-browser
          ref: 08bac388a0abfd06426bebe8f6fabd0157d2e709
          path: build/hosted-browser-source
          persist-credentials: false
      - name: Install dependencies only on this disposable runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          timeout 180s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          timeout 300s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            apparmor bubblewrap git python3 util-linux iproute2 ca-certificates \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6t64 libpci3 fonts-dejavu-core \
            libnspr4 libevent-2.1-7t64 libvpx9
          umask 077
          dpkg-query -W apparmor bubblewrap git python3 util-linux iproute2 ca-certificates \
            libc6 libstdc++6 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 \
            libxt6t64 libpci3 fonts-dejavu-core libnspr4 libevent-2.1-7t64 libvpx9 \
            > build/hosted-client-packages.txt
      - name: Prepare authenticated public Node npm and Firefox inputs
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_runtime.py --with-npm --fetch \
            --output "$GITHUB_WORKSPACE/build/hosted-client-runtime"
      - name: Build offline and exercise the real client with synthetic products
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_clients_ci.py
      - name: Retain bounded build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-weather-client-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/hosted-client-packages.txt
            build/hosted-client-runtime/provenance.json
            build/hosted-clients-ci/*.json
            build/hosted-clients-ci/*.log
            build/drizzli-hosted-browser-ci/report.json
            build/drizzli-hosted-browser-ci/*.log
      - name: Prepare the successful source recipe
        if: success()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_source_recipe.py --profile drizzli \
            --expected-commit "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/build/hosted-drizzli-source-recipe"
      - name: Retain only the successful source recipe
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-weather-client-source-recipe-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/hosted-drizzli-source-recipe
      - name: State the scope of the trial
        if: always()
        run: |
          printf '%s\n' \
            'Inspect original outcomes and receipts: this is an actual Drizz.li build and synthetic browser trial.' \
            'No live Weather source request, core delivery, private bundle upload or native mobile proof.' \
            'Source recipes contain references, not full upstream/dependency source or runtime acceptance.' \
            >> "$GITHUB_STEP_SUMMARY"

  input-candidate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.input_mode == 'source-input-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify candidate source before primary data acquisition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          umask 077
          mkdir -m 700 -p build
          python3 -B -m unittest discover -s tests -p 'test_hosted_client_inputs.py'
      - name: Acquire signed snapshot and locked dependency candidate as data
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=15s 1500s python3 -B scripts/prepare_hosted_client_inputs.py --profile drizzli --mode source-input-inventory
      - name: Project closed source and metadata evidence
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/prepare_hosted_client_inputs.py --profile drizzli --mode stage-input-metadata
      - name: Retain only candidate metadata and original source notices
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-drizzli-input-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build/hosted-drizzli-input-candidate-public
      - name: Remove runner-local package data
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = "$(pwd -P)"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rm -rf -- "$GITHUB_WORKSPACE/build/hosted-drizzli-input-candidate" "$GITHUB_WORKSPACE/build/hosted-drizzli-input-candidate-public"
