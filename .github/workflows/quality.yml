name: Weather integration components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the runner test runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
      - name: Check ECMWF and core-cache contracts
        run: node --test tests/*.test.mjs
      - name: Check Drizz.li adapter without downloading upstream dependencies
        run: node --test integrations/drizzli/test-client.mjs
      - name: Check Overmorrow integration without downloading upstream dependencies
        run: |
          node --test integrations/overmorrow/test-browser-fixture.mjs
          VOLPAROSSA_TEST_NODE="$(command -v node)" python3 -B -m unittest discover \
            -s integrations/overmorrow -p 'test_*.py'
      - name: Check source metadata and whitespace
        run: |
          python3 -m json.tool third_party/ecmwf.json > /dev/null
          python3 -m json.tool third_party/ecmwf-smoke.json > /dev/null
          python3 -m json.tool third_party/ecmwf-wind-smoke.json > /dev/null
          python3 -m json.tool third_party/ecmwf-precipitation-smoke.json > /dev/null
          python3 -m json.tool third_party/eccodes-sources.json > /dev/null
          python3 -m json.tool integrations/drizzli/upstream.json > /dev/null
          python3 -m json.tool integrations/drizzli/build-plugins.json > /dev/null
          python3 -m json.tool integrations/drizzli/browser-smoke.json > /dev/null
          python3 -m json.tool integrations/drizzli/precipitation-build.json > /dev/null
          python3 -m json.tool integrations/drizzli/precipitation-browser-smoke.json > /dev/null
          python3 -m json.tool integrations/overmorrow/upstream.json > /dev/null
          python3 -m json.tool integrations/overmorrow/build-verification.json > /dev/null
          git diff --check

# No live weather requests, dependency installation, decoder build, model
# inference or daemon startup. Contract tests do not establish overlay delivery.
