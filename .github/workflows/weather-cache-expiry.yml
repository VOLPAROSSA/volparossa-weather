name: Offline Weather publication expiry
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/weather-cache-expiry.yml
      - tests/native-cache/**
      - src/core-cache.mjs
      - src/provider-http.mjs
      - integrations/drizzli/overlay/src/lib/services/volparossa/client.mjs

permissions:
  contents: read
concurrency:
  group: weather-cache-expiry-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never

jobs:
  native-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./tests/native-cache/prepare
      - name: Observe the signed expiry in a Debian KVM guest without a network card
        run: bash tests/native-cache/run-guest.sh
      - name: Preserve the public source and lifecycle receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-offline-expiry-${{ github.sha }}
          path: ${{ env.WEATHER_TRIAL }}/result.json
          if-no-files-found: error
          retention-days: 30
