name: Overmorrow on the iPhone Simulator
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/iphone-simulator.yml
      - tests/ios-simulator/**
      - LICENSE
      - integrations/overmorrow/stage.py
      - integrations/overmorrow/upstream.json
      - integrations/overmorrow/upstream.patch
      - integrations/overmorrow/overlay/lib/**
      - integrations/overmorrow/*fixture*.mjs
      - integrations/drizzli/browser-fixture.mjs
      - tests/*fixtures.mjs
      - src/*.mjs
permissions:
  contents: read
concurrency:
  group: weather-iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./tests/ios-simulator/build-app
      - name: Read the two synthetic products and observe the original interface
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc tests/ios-simulator/screen.swift -o "$RUNNER_TEMP/read-weather-screen"
          python3 -B tests/ios-simulator/observe.py build/ios-source/build/ios/iphonesimulator/Runner.app \
            "$RUNNER_TEMP/read-weather-screen" "$RUNNER_TEMP/iphone-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: overmorrow-iphone-${{ github.sha }}
          path: ${{ runner.temp }}/iphone-result.json
          retention-days: 30
          if-no-files-found: error
